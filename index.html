<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎄 Countdown Nataru 2026 🎄</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    min-height: 100vh;
    overflow-x: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #fff;
    font-family: 'Poppins', sans-serif;
    padding: 20px;
    position: relative;
    background: #050a08;
  }

  /* 🖼️ BACKGROUND REALISTIS */
  .bg-layer {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    background-image: 
      linear-gradient(rgba(5, 15, 10, 0.55), rgba(5, 15, 10, 0.75)),
      url('https://images.unsplash.com/photo-1512389142860-9c449e58a543?w=1920&q=80');
    background-size: cover;
    background-position: center;
    filter: saturate(1.3) contrast(1.1);
    animation: bgZoom 30s ease-in-out infinite alternate;
  }
  @keyframes bgZoom {
    from { transform: scale(1); }
    to { transform: scale(1.08); }
  }

  /* 🌫️ OVERLAY UE5 */
  .overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
    background: 
      radial-gradient(ellipse at center, transparent 0%, transparent 40%, rgba(0,0,0,0.7) 100%),
      radial-gradient(circle at 20% 30%, rgba(255, 100, 100, 0.15) 0%, transparent 30%),
      radial-gradient(circle at 80% 70%, rgba(100, 255, 150, 0.12) 0%, transparent 30%),
      radial-gradient(circle at 50% 90%, rgba(255, 215, 0, 0.1) 0%, transparent 40%);
  }

  /* 📸 Film grain */
  .grain {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    pointer-events: none;
    opacity: 0.06;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    animation: grainShift 0.5s steps(2) infinite;
  }
  @keyframes grainShift {
    0% { transform: translate(0,0); }
    50% { transform: translate(-2px, 2px); }
    100% { transform: translate(2px, -2px); }
  }

  /* 💡 Bokeh */
  .bokeh {
    position: fixed;
    border-radius: 50%;
    z-index: 1;
    pointer-events: none;
    filter: blur(15px);
    animation: bokehFloat 8s ease-in-out infinite;
  }
  .bokeh-1 { top: 10%; left: 8%; width: 60px; height: 60px; background: rgba(255, 100, 100, 0.7); }
  .bokeh-2 { top: 25%; right: 12%; width: 80px; height: 80px; background: rgba(255, 215, 0, 0.6); animation-delay: 1s; }
  .bokeh-3 { bottom: 20%; left: 15%; width: 70px; height: 70px; background: rgba(100, 255, 150, 0.5); animation-delay: 2s; }
  .bokeh-4 { bottom: 30%; right: 20%; width: 50px; height: 50px; background: rgba(255, 200, 100, 0.6); animation-delay: 3s; }
  .bokeh-5 { top: 50%; left: 45%; width: 100px; height: 100px; background: rgba(255, 150, 150, 0.3); animation-delay: 1.5s; }
  @keyframes bokehFloat {
    0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.7; }
    50% { transform: translate(20px, -30px) scale(1.2); opacity: 1; }
  }

  /* ❄️ Salju */
  .snow-container {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 3;
    overflow: hidden;
  }
  .snowflake {
    position: absolute;
    top: -20px;
    background: #fff;
    border-radius: 50%;
    animation: snowfall linear infinite;
    box-shadow: 0 0 6px rgba(255,255,255,0.9);
  }
  @keyframes snowfall {
    0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(110vh) translateX(80px) rotate(720deg); opacity: 0; }
  }

  /* ✨ Sparkle */
  .sparkle {
    position: fixed;
    width: 4px; height: 4px;
    background: #ffd700;
    border-radius: 50%;
    z-index: 2;
    pointer-events: none;
    box-shadow: 0 0 10px 3px rgba(255, 215, 0, 0.8);
    animation: sparkleFloat linear infinite;
  }
  @keyframes sparkleFloat {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    20% { opacity: 1; }
    80% { opacity: 1; }
    100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
  }

  /* 🎵 Tombol musik */
  .music-btn {
    position: fixed;
    bottom: 25px;
    right: 25px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, #b91c1c, #ffd700);
    border: 2px solid rgba(255, 215, 0, 0.8);
    color: #fff;
    font-size: 1.5rem;
    cursor: pointer;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 
      0 0 25px rgba(255, 215, 0, 0.7),
      0 0 50px rgba(255, 59, 59, 0.4),
      inset 0 2px 5px rgba(255, 255, 255, 0.3);
    transition: all 0.3s ease;
    animation: musicPulse 2s ease-in-out infinite;
  }
  .music-btn:hover {
    transform: scale(1.15) rotate(10deg);
    box-shadow: 
      0 0 40px rgba(255, 215, 0, 1),
      0 0 80px rgba(255, 59, 59, 0.6);
  }
  .music-btn.playing {
    animation: musicSpin 3s linear infinite;
  }
  @keyframes musicPulse {
    0%, 100% { box-shadow: 0 0 25px rgba(255, 215, 0, 0.7), 0 0 50px rgba(255, 59, 59, 0.4), inset 0 2px 5px rgba(255,255,255,0.3); }
    50% { box-shadow: 0 0 40px rgba(255, 215, 0, 1), 0 0 80px rgba(255, 59, 59, 0.7), inset 0 2px 5px rgba(255,255,255,0.3); }
  }
  @keyframes musicSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* Tooltip */
  .music-tip {
    position: fixed;
    bottom: 95px;
    right: 25px;
    background: rgba(0, 0, 0, 0.85);
    color: #ffd700;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 0.75rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    border: 1px solid rgba(255, 215, 0, 0.5);
    z-index: 100;
    pointer-events: none;
    animation: tipBounce 2s ease-in-out infinite;
    white-space: nowrap;
  }
  @keyframes tipBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }

  /* Konten utama */
  .container {
    position: relative;
    z-index: 10;
    text-align: center;
    max-width: 950px;
    width: 100%;
    padding: 2rem;
    background: rgba(10, 20, 15, 0.35);
    backdrop-filter: blur(20px) saturate(1.3);
    -webkit-backdrop-filter: blur(20px) saturate(1.3);
    border: 1px solid rgba(255, 215, 0, 0.25);
    border-radius: 24px;
    box-shadow: 
      0 0 80px rgba(255, 215, 0, 0.15),
      0 20px 60px rgba(0, 0, 0, 0.6),
      inset 0 1px 0 rgba(255, 255, 255, 0.1);
  }

  .badge {
    display: inline-block;
    padding: 0.4rem 1.2rem;
    background: linear-gradient(135deg, rgba(255, 59, 59, 0.3), rgba(0, 230, 118, 0.3));
    border: 1px solid rgba(255, 215, 0, 0.5);
    border-radius: 50px;
    font-size: 0.75rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 1.5rem;
    color: #ffd700;
    font-weight: 600;
    animation: badgePulse 2s ease-in-out infinite;
  }
  @keyframes badgePulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.4); }
    50% { box-shadow: 0 0 0 12px rgba(255, 215, 0, 0); }
  }

  h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.8rem, 6vw, 3.5rem);
    font-weight: 900;
    letter-spacing: 4px;
    background: linear-gradient(135deg, #ff3b3b 0%, #ffd700 25%, #fff 50%, #00e676 75%, #ffd700 100%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: xmasShine 5s linear infinite;
    margin-bottom: 0.5rem;
    filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.5));
  }
  @keyframes xmasShine {
    to { background-position: 200% center; }
  }

  .subtitle {
    font-size: clamp(0.8rem, 1.8vw, 1rem);
    color: #a8e6c0;
    letter-spacing: 6px;
    text-transform: uppercase;
    margin-bottom: 0.8rem;
    font-weight: 300;
  }

  .target-date {
    font-size: clamp(0.85rem, 2vw, 1rem);
    color: #ddd;
    letter-spacing: 3px;
    margin-bottom: 2.5rem;
  }
  .target-date span {
    color: #ffd700;
    font-weight: 700;
    text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
  }

  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin-bottom: 2rem;
  }
  .divider-line {
    width: 100px; height: 1px;
    background: linear-gradient(90deg, transparent, #ffd700, transparent);
  }
  .divider-icon {
    color: #ffd700;
    font-size: 0.9rem;
    filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.8));
    animation: iconPulse 2s ease-in-out infinite;
  }
  @keyframes iconPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.3); }
  }

  #timer {
    display: flex;
    gap: clamp(0.5rem, 2vw, 1.2rem);
    flex-wrap: wrap;
    justify-content: center;
  }

  .box {
    position: relative;
    background: linear-gradient(145deg, rgba(20, 40, 30, 0.75), rgba(10, 20, 15, 0.85));
    border: 1px solid rgba(255, 215, 0, 0.4);
    padding: clamp(1rem, 3vw, 1.8rem) clamp(0.9rem, 3vw, 2rem);
    border-radius: 16px;
    text-align: center;
    min-width: clamp(72px, 18vw, 125px);
    box-shadow:
      0 0 40px rgba(255, 215, 0, 0.2),
      inset 0 1px 0 rgba(255, 215, 0, 0.3),
      inset 0 -1px 0 rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(15px);
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
  }

  .box::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.3), transparent);
    transition: left 0.7s;
  }
  .box:hover::before { left: 100%; }

  .box:hover {
    transform: translateY(-8px) scale(1.03);
    border-color: #ffd700;
    box-shadow:
      0 0 70px rgba(255, 215, 0, 0.6),
      0 0 120px rgba(255, 59, 59, 0.3),
      inset 0 1px 0 rgba(255, 215, 0, 0.6);
  }

  .num {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.9rem, 6vw, 3.6rem);
    font-weight: 900;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg, #ffffff 0%, #ffd700 50%, #ff3b3b 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.8));
    transition: transform 0.3s;
  }

  .box:hover .num { transform: scale(1.1); }

  .label {
    font-size: clamp(0.6rem, 1.5vw, 0.78rem);
    color: #ffe9a8;
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-top: 0.7rem;
    font-weight: 600;
    text-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
  }

  .box::after {
    content: '';
    position: absolute;
    top: 6px; right: 6px;
    width: 14px; height: 14px;
    border-top: 1px solid #ffd700;
    border-right: 1px solid #ffd700;
    opacity: 0.7;
  }

  .done {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.5rem, 5vw, 2.8rem);
    font-weight: 900;
    background: linear-gradient(135deg, #ff3b3b, #ffd700, #fff, #00e676, #ffd700, #ff3b3b);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: xmasShine 3s linear infinite;
    text-align: center;
    padding: 2rem;
    filter: drop-shadow(0 0 40px rgba(255, 215, 0, 0.8));
  }

  .footer {
    position: relative;
    z-index: 10;
    margin-top: 2rem;
    font-size: 0.75rem;
    color: #a8e6c0;
    letter-spacing: 4px;
    text-transform: uppercase;
    font-weight: 300;
    text-shadow: 0 0 10px rgba(0, 230, 118, 0.5);
  }

  .fade-in {
    opacity: 0;
    transform: translateY(20px);
    animation: fadeIn 1.2s ease forwards;
  }
  @keyframes fadeIn {
    to { opacity: 1; transform: translateY(0); }
  }
  .delay-1 { animation-delay: 0.2s; }
  .delay-2 { animation-delay: 0.4s; }
  .delay-3 { animation-delay: 0.6s; }
  .delay-4 { animation-delay: 0.8s; }
  .delay-5 { animation-delay: 1s; }

  @media (max-width: 600px) {
    .container { padding: 1.2rem; border-radius: 18px; }
    .divider-line { width: 50px; }
    .target-date { margin-bottom: 1.8rem; }
    .music-btn { width: 50px; height: 50px; font-size: 1.2rem; bottom: 15px; right: 15px; }
    .music-tip { bottom: 75px; right: 15px; font-size: 0.65rem; }
  }
</style>
</head>
<body>

  <!-- 🖼️ Background -->
  <div class="bg-layer"></div>

  <!-- 🌫️ Overlay UE5 -->
  <div class="overlay"></div>

  <!-- 📸 Film grain -->
  <div class="grain"></div>

  <!-- 💡 Bokeh -->
  <div class="bokeh bokeh-1"></div>
  <div class="bokeh bokeh-2"></div>
  <div class="bokeh bokeh-3"></div>
  <div class="bokeh bokeh-4"></div>
  <div class="bokeh bokeh-5"></div>

  <!-- ❄️ Salju -->
  <div class="snow-container" id="snow"></div>

  <!-- 🎵 Audio + Tombol Musik -->
  <audio id="bgMusic" loop preload="auto">
    <source src="tunetank-jingle-bells-slap-house-348413.mp3" type="audio/mpeg">
  </audio>

  <button class="music-btn" id="musicBtn" title="Play / Pause Musik">
    🎵
  </button>
  <div class="music-tip" id="musicTip">🎶 Klik untuk musik 🎶</div>

  <div class="container">
    <div class="badge fade-in delay-1">✦ Christmas Edition ✦</div>

    <h1 class="fade-in delay-2">SELAMAT NATAL & TAHUN BARU</h1>

    <p class="subtitle fade-in delay-2">Menuju Libur Nataru</p>

    <p class="target-date fade-in delay-3">
      📅 <span>10 Desember 2026</span> • 00:00 WIB
    </p>

    <div class="divider fade-in delay-3">
      <div class="divider-line"></div>
      <div class="divider-icon">◆</div>
      <div class="divider-line"></div>
    </div>

    <div id="timer" class="fade-in delay-4">
      <div class="box">
        <div class="num" id="d">00</div>
        <div class="label">Hari</div>
      </div>
      <div class="box">
        <div class="num" id="h">00</div>
        <div class="label">Jam</div>
      </div>
      <div class="box">
        <div class="num" id="m">00</div>
        <div class="label">Menit</div>
      </div>
      <div class="box">
        <div class="num" id="s">00</div>
        <div class="label">Detik</div>
      </div>
    </div>
  </div>

  <div class="footer fade-in delay-5">
    ✦ Countdown by Rehan ✦
  </div>

<script>
  // 🎯 TARGET: 10 Desember 2026, 00:00 WIB
  const target = new Date("2026-12-10T00:00:00+07:00").getTime();

  // ❄️ Salju
  const snowContainer = document.getElementById("snow");
  for (let i = 0; i < 80; i++) {
    const s = document.createElement("div");
    s.className = "snowflake";
    const size = Math.random() * 6 + 2;
    s.style.width = size + "px";
    s.style.height = size + "px";
    s.style.left = Math.random() * 100 + "%";
    s.style.animationDuration = (Math.random() * 10 + 6) + "s";
    s.style.animationDelay = (Math.random() * 12) + "s";
    s.style.opacity = Math.random() * 0.7 + 0.3;
    if (Math.random() > 0.7) {
      s.style.filter = "blur(2px)";
      s.style.opacity = 0.4;
    }
    snowContainer.appendChild(s);
  }

  // ✨ Sparkle emas
  for (let i = 0; i < 25; i++) {
    const sp = document.createElement("div");
    sp.className = "sparkle";
    sp.style.left = Math.random() * 100 + "%";
    sp.style.animationDuration = (Math.random() * 8 + 6) + "s";
    sp.style.animationDelay = (Math.random() * 10) + "s";
    document.body.appendChild(sp);
  }

  // 🎵 KONTROL MUSIK
  const music = document.getElementById("bgMusic");
  const musicBtn = document.getElementById("musicBtn");
  const musicTip = document.getElementById("musicTip");
  let isPlaying = false;

  music.volume = 0.5;

  function toggleMusic() {
    if (isPlaying) {
      music.pause();
      musicBtn.textContent = "🎵";
      musicBtn.classList.remove("playing");
      musicTip.textContent = "🎶 Klik untuk musik 🎶";
      isPlaying = false;
    } else {
      music.play().then(() => {
        musicBtn.textContent = "⏸";
        musicBtn.classList.add("playing");
        musicTip.textContent = "⏸ Klik untuk pause";
        isPlaying = true;
      }).catch(err => {
        console.log("Gagal play:", err);
        musicTip.textContent = "⚠️ Klik lagi ya";
      });
    }
  }

  musicBtn.addEventListener("click", toggleMusic);

  // Sembunyikan tooltip
  setTimeout(() => {
    musicTip.style.transition = "opacity 1s";
    musicTip.style.opacity = "0";
    setTimeout(() => musicTip.style.display = "none", 1000);
  }, 5000);

  // Autoplay saat user klik pertama kali
  document.body.addEventListener("click", function autoStart() {
    if (!isPlaying) {
      music.play().then(() => {
        musicBtn.textContent = "⏸";
        musicBtn.classList.add("playing");
        musicTip.textContent = "⏸ Klik untuk pause";
        isPlaying = true;
      }).catch(() => {});
    }
    document.body.removeEventListener("click", autoStart);
  }, { once: true });

  // ⏰ Countdown
  function update() {
    const now = Date.now();
    const diff = target - now;

    if (diff <= 0) {
      document.getElementById("timer").innerHTML =
        '<div class="done">🎄 SELAMAT NATAL & TAHUN BARU 🎄</div>';
      return;
    }

    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
    const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const m = Math.floor((diff / (1000 * 60)) % 60);
    const s = Math.floor((diff / 1000) % 60);

    document.getElementById("d").textContent = String(d).padStart(2, "0");
    document.getElementById("h").textContent = String(h).padStart(2, "0");
    document.getElementById("m").textContent = String(m).padStart(2, "0");
    document.getElementById("s").textContent = String(s).padStart(2, "0");
  }

  update();
  setInterval(update, 1000);
</script>
</body>
</html>
