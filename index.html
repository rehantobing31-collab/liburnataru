<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎄 Countdown Libur Nataru 2026 🎅</title>
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    min-height: 100vh;
    overflow-x: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: 
      radial-gradient(ellipse at top, #1a3a2e 0%, #0d1f17 40%, #050a08 100%);
    color: #fff;
    font-family: 'Poppins', sans-serif;
    padding: 20px;
    position: relative;
  }

  /* ❄️ Salju turun */
  .snow-container {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }
  .snowflake {
    position: absolute;
    top: -10px;
    color: #fff;
    font-size: 1em;
    text-shadow: 0 0 5px rgba(255,255,255,0.8);
    animation: snowfall linear infinite;
    user-select: none;
  }
  @keyframes snowfall {
    0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(110vh) translateX(50px) rotate(360deg); opacity: 0; }
  }

  /* 💡 Lampu kelap-kelip di atas */
  .lights {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    display: flex;
    justify-content: space-around;
    padding: 0 10px;
    z-index: 3;
    pointer-events: none;
  }
  .light {
    width: 12px; height: 12px;
    border-radius: 50%;
    margin-top: 5px;
    animation: blink 1.5s infinite;
    box-shadow: 0 0 10px 2px currentColor;
  }
  .light:nth-child(4n+1) { color: #ff3b3b; background: #ff3b3b; animation-delay: 0s; }
  .light:nth-child(4n+2) { color: #ffd700; background: #ffd700; animation-delay: 0.3s; }
  .light:nth-child(4n+3) { color: #00e676; background: #00e676; animation-delay: 0.6s; }
  .light:nth-child(4n+4) { color: #40c4ff; background: #40c4ff; animation-delay: 0.9s; }
  @keyframes blink {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.3; transform: scale(0.8); }
  }

  /* Pohon natal kiri-kanan */
  .tree {
    position: fixed;
    bottom: 0;
    font-size: clamp(4rem, 12vw, 9rem);
    z-index: 2;
    filter: drop-shadow(0 0 20px rgba(0, 230, 118, 0.5));
    animation: treeSway 3s ease-in-out infinite;
    pointer-events: none;
  }
  .tree-left { left: -10px; }
  .tree-right { right: -10px; animation-delay: 1.5s; }
  @keyframes treeSway {
    0%, 100% { transform: rotate(-3deg); }
    50% { transform: rotate(3deg); }
  }

  /* Konten */
  .container {
    position: relative;
    z-index: 5;
    text-align: center;
    max-width: 900px;
    width: 100%;
  }

  /* Sinterklas */
  .santa {
    font-size: clamp(3.5rem, 10vw, 6rem);
    margin-bottom: 0.5rem;
    display: inline-block;
    animation: santaWave 1.5s ease-in-out infinite;
    filter: drop-shadow(0 0 25px rgba(255, 59, 59, 0.7));
  }
  @keyframes santaWave {
    0%, 100% { transform: rotate(-8deg) scale(1); }
    50% { transform: rotate(8deg) scale(1.08); }
  }

  h1 {
    font-family: 'Mountains of Christmas', cursive;
    font-size: clamp(2rem, 7vw, 4rem);
    font-weight: 700;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #ff3b3b 0%, #ffd700 30%, #fff 50%, #ffd700 70%, #00e676 100%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: xmasShine 5s linear infinite;
    margin-bottom: 0.5rem;
    text-shadow: 0 0 40px rgba(255, 215, 0, 0.4);
  }
  @keyframes xmasShine {
    to { background-position: 200% center; }
  }

  .subtitle {
    font-size: clamp(0.85rem, 2vw, 1.1rem);
    color: #a8e6c0;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
    font-weight: 300;
  }

  .target-date {
    font-size: 0.95rem;
    color: #ccc;
    letter-spacing: 2px;
    margin-bottom: 3rem;
  }
  .target-date span {
    color: #ffd700;
    font-weight: 700;
  }

  /* Ornamen pembatas */
  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin-bottom: 2.5rem;
  }
  .divider-line {
    width: 80px; height: 2px;
    background: linear-gradient(90deg, transparent, #ff3b3b, transparent);
  }
  .divider-line.right {
    background: linear-gradient(90deg, transparent, #00e676, transparent);
  }
  .divider-icon {
    font-size: 1.3rem;
    animation: blink 1.5s infinite;
  }

  /* Timer */
  #timer {
    display: flex;
    gap: clamp(0.5rem, 2vw, 1.2rem);
    flex-wrap: wrap;
    justify-content: center;
  }

  .box {
    position: relative;
    background: linear-gradient(145deg, rgba(180, 30, 30, 0.9), rgba(20, 60, 40, 0.95));
    border: 2px solid rgba(255, 215, 0, 0.5);
    padding: clamp(1rem, 3vw, 2rem) clamp(1rem, 3vw, 2.2rem);
    border-radius: 18px;
    text-align: center;
    min-width: clamp(75px, 18vw, 130px);
    box-shadow:
      0 0 30px rgba(255, 59, 59, 0.3),
      inset 0 1px 0 rgba(255, 215, 0, 0.3),
      inset 0 -1px 0 rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(10px);
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
  }

  .box::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.25), transparent);
    transition: left 0.6s;
  }
  .box:hover::before { left: 100%; }

  .box:hover {
    transform: translateY(-8px);
    border-color: #ffd700;
    box-shadow:
      0 0 60px rgba(255, 215, 0, 0.5),
      inset 0 1px 0 rgba(255, 215, 0, 0.5);
  }

  .num {
    font-family: 'Mountains of Christmas', cursive;
    font-size: clamp(2rem, 6vw, 3.8rem);
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg, #fff 0%, #ffd700 50%, #ff3b3b 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.7));
    transition: transform 0.3s;
  }

  .box:hover .num { transform: scale(1.08); }

  .label {
    font-size: clamp(0.65rem, 1.5vw, 0.85rem);
    color: #ffe9a8;
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-top: 0.7rem;
    font-weight: 600;
    text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
  }

  .box::after {
    content: '';
    position: absolute;
    top: 6px; right: 6px;
    width: 14px; height: 14px;
    border-top: 2px solid #ffd700;
    border-right: 2px solid #ffd700;
    opacity: 0.7;
  }

  /* Pesan selesai */
  .done {
    font-family: 'Mountains of Christmas', cursive;
    font-size: clamp(1.8rem, 5vw, 3rem);
    font-weight: 700;
    background: linear-gradient(135deg, #ff3b3b, #ffd700, #fff, #00e676, #ffd700, #ff3b3b);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: xmasShine 3s linear infinite;
    text-align: center;
    padding: 2rem;
    filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.7));
  }

  /* Footer */
  .footer {
    position: relative;
    z-index: 5;
    margin-top: 3rem;
    font-size: 0.8rem;
    color: #a8e6c0;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 300;
  }

  /* Animasi masuk */
  .fade-in {
    opacity: 0;
    transform: translateY(20px);
    animation: fadeIn 1s ease forwards;
  }
  @keyframes fadeIn {
    to { opacity: 1; transform: translateY(0); }
  }
  .delay-1 { animation-delay: 0.2s; }
  .delay-2 { animation-delay: 0.4s; }
  .delay-3 { animation-delay: 0.6s; }
  .delay-4 { animation-delay: 0.8s; }
  .delay-5 { animation-delay: 1s; }

  /* Hadiah di bawah */
  .gifts {
    position: fixed;
    bottom: 5px;
    left: 50%;
    transform: translateX(-50%);
    font-size: clamp(1.2rem, 3vw, 2rem);
    letter-spacing: 8px;
    z-index: 4;
    filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.6));
    animation: giftsBounce 2s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes giftsBounce {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-8px); }
  }

  @media (max-width: 600px) {
    .divider-line { width: 40px; }
    .target-date { margin-bottom: 2rem; }
    .tree { font-size: 3.5rem; }
  }
</style>
</head>
<body>

  <!-- 💡 Lampu natal di atas -->
  <div class="lights">
    <div class="light"></div><div class="light"></div><div class="light"></div>
    <div class="light"></div><div class="light"></div><div class="light"></div>
    <div class="light"></div><div class="light"></div><div class="light"></div>
    <div class="light"></div><div class="light"></div><div class="light"></div>
    <div class="light"></div><div class="light"></div><div class="light"></div>
    <div class="light"></div><div class="light"></div><div class="light"></div>
    <div class="light"></div><div class="light"></div><div class="light"></div>
  </div>

  <!-- 🌲 Pohon natal -->
  <div class="tree tree-left">🎄</div>
  <div class="tree tree-right">🎄</div>

  <!-- ❄️ Salju -->
  <div class="snow-container" id="snow"></div>

  <!-- 🎁 Hadiah di bawah -->
  <div class="gifts">🎁 🎀 🎁</div>

  <div class="container">
    <div class="santa fade-in delay-1">🎅</div>

    <h1 class="fade-in delay-2">Selamat Natal & Tahun Baru</h1>

    <p class="subtitle fade-in delay-2">Menuju Libur Nataru</p>

    <p class="target-date fade-in delay-3">
      📅 <span>10 Desember 2026</span> • 00:00 WIB
    </p>

    <div class="divider fade-in delay-3">
      <div class="divider-line"></div>
      <div class="divider-icon">🎄</div>
      <div class="divider-line right"></div>
    </div>

    <div id="timer" class="fade-in delay-4">
      <div class="box">
        <div class="num" id="d">00</div>
        <div class="label">Hari</div>
      </div>
      <div class="box">
        <div class="num" id="h">00</div>
        <div class="label">Jam</div>
      </div>
      <div class="box">
        <div class="num" id="m">00</div>
        <div class="label">Menit</div>
      </div>
      <div class="box">
        <div class="num" id="s">00</div>
        <div class="label">Detik</div>
      </div>
    </div>
  </div>

  <div class="footer fade-in delay-5">
    ✦ Ho Ho Ho • Countdown by Rehan ✦
  </div>

<script>
  // 🎯 TARGET: 10 Desember 2026, 00:00 WIB
  const target = new Date("2026-12-10T00:00:00+07:00").getTime();

  // ❄️ Generate salju
  const snowContainer = document.getElementById("snow");
  const snowflakes = ["❄", "❅", "❆", "•", "*"];
  for (let i = 0; i < 60; i++) {
    const s = document.createElement("div");
    s.className = "snowflake";
    s.textContent = snowflakes[Math.floor(Math.random() * snowflakes.length)];
    s.style.left = Math.random() * 100 + "%";
    s.style.fontSize = (Math.random() * 15 + 8) + "px";
    s.style.animationDuration = (Math.random() * 8 + 5) + "s";
    s.style.animationDelay = (Math.random() * 10) + "s";
    s.style.opacity = Math.random() * 0.7 + 0.3;
    snowContainer.appendChild(s);
  }

  // ⏰ Update countdown
  function update() {
    const now = Date.now();
    const diff = target - now;

    if (diff <= 0) {
      document.getElementById("timer").innerHTML =
        '<div class="done">🎄 SELAMAT NATAL & TAHUN BARU 🎅</div>';
      return;
    }

    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
    const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const m = Math.floor((diff / (1000 * 60)) % 60);
    const s = Math.floor((diff / 1000) % 60);

    document.getElementById("d").textContent = String(d).padStart(2, "0");
    document.getElementById("h").textContent = String(h).padStart(2, "0");
    document.getElementById("m").textContent = String(m).padStart(2, "0");
    document.getElementById("s").textContent = String(s).padStart(2, "0");
  }

  update();
  setInterval(update, 1000);
</script>
</body>
</html>
